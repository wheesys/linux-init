name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build (release)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/linux-init

      - name: Package binary
        run: |
          cp LICENSE target/x86_64-unknown-linux-gnu/release/
          cd target/x86_64-unknown-linux-gnu/release
          tar czf linux-init-x86_64-unknown-linux-gnu.tar.gz linux-init LICENSE
          sha256sum linux-init-x86_64-unknown-linux-gnu.tar.gz > linux-init-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## linux-init ${{ github.ref_name }}

            自动构建的 Release。

            ### 安装

            ```bash
            # Arch Linux / CachyOS / Manjaro (AUR)
            yay -S linux-init-bin

            # Fedora (COPR)
            sudo dnf copr enable wheesys/linux-init
            sudo dnf install linux-init

            # 预编译二进制
            tar xzf linux-init-x86_64-unknown-linux-gnu.tar.gz
            sudo cp linux-init /usr/local/bin/
            ```

            ### 变更
            详见 [commits](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          files: |
            target/x86_64-unknown-linux-gnu/release/linux-init-x86_64-unknown-linux-gnu.tar.gz
            target/x86_64-unknown-linux-gnu/release/linux-init-x86_64-unknown-linux-gnu.tar.gz.sha256
